services:
  app:
    image: spend212:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      APP_TURNSTILE_SITE_KEY: ${APP_TURNSTILE_SITE_KEY:?Set APP_TURNSTILE_SITE_KEY before starting}
      APP_TURNSTILE_SECRET_KEY: ${APP_TURNSTILE_SECRET_KEY:?Set APP_TURNSTILE_SECRET_KEY before starting}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-auto}
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-}
    volumes:
      - budget_data:/data
    secrets:
      - database_key
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  budget_data:

secrets:
  database_key:
    file: ${APP_KEY_HOST_FILE:-../.local/secrets/database.key}
