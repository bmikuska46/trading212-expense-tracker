services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the published container image}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_TURNSTILE_SECRET_KEY: ${APP_TURNSTILE_SECRET_KEY:?Set APP_TURNSTILE_SECRET_KEY before starting}
      APP_COOKIE_SECURE: always
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-}
      APP_DATABASE_KEY: ${APP_DATABASE_KEY:?Set APP_DATABASE_KEY to a 64-character hexadecimal encryption key}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s' "$$APP_DATABASE_KEY" > /run/secrets/database_key
        unset APP_DATABASE_KEY
        exec /app/server
    volumes:
      - budget_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/secrets:size=1m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  budget_data:
